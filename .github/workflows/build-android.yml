name: Build GeneralsX Android APK (Dual-Hz)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson cmake python3-pip

      - name: Run GeneralsX Dual-Hz Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GX_BUILD_GAMES: "zh"
        run: |
          git submodule update --init --recursive references/fbraz3-dxvk
          chmod +x ./scripts/build/android/build-dual-hz.sh
          ./scripts/build/android/build-dual-hz.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeneralsXZH-Android-DualHz-APK
          path: |
            build/android/*.apk
            scripts/build/android/build/*.apk
